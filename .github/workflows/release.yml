name: 构建与发布

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    # 纯文档改动不跑 CI（Actions 分钟数按私有仓库计费，能省则省）
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

# 同一个分支只保留最新一次运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # CI：PR / 推送到 main 时跑（打标签时跳过，避免重复构建）
  # ============================================================
  ci:
    name: 分析 · 测试
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 21（与本地 flutter config --jdk-dir 一致）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: 安装依赖
        run: flutter pub get

      - name: 给 flutter_live2d 打本地补丁
        # 上游 1.0.2 有两个 bug：CubismFramework 在无 GL context 线程初始化、
        # shader 文件没打进 APK，导致「加载成功但画面空白」。补丁脚本幂等。
        run: dart run tool/patch_live2d_plugin.dart


      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

  # ============================================================
  # 发布 Android（只有打 v* 标签才跑）
  # ============================================================
  release-android:
    name: 发布 Android APK
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        # 同 ci：runner 预装组件占 30GB+，本项目用不到（NDK 保留，原生渲染需要）
        run: |
          echo "===== 清理前 ====="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/chromium
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean -qq >/dev/null 2>&1 || true
          echo "===== 清理后 ====="
          df -h /

      - name: 安装 Android SDK 组件（CMake / NDK）
        # flutter_live2d 用 Cubism Native SDK，需要 CMake 3.10.2 + NDK 27.2
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install \
            "cmake;3.10.2.4988404" "ndk;27.2.12479018"

      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: 切换到官方依赖源
        run: |
          sed -i 's|https://mirrors.cloud.tencent.com/gradle/|https://services.gradle.org/distributions/|' \
            android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's|https://mirrors.huaweicloud.com/gradle/|https://services.gradle.org/distributions/|' \
            android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/mirrors\.cloud\.tencent\.com\/nexus\/repository\/maven-public/d' \
            android/settings.gradle.kts android/build.gradle.kts
          sed -i '/repo\.huaweicloud\.com\/repository\/maven/d' \
            android/settings.gradle.kts android/build.gradle.kts

      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::未配置 Secret KEYSTORE_BASE64，无法发布正式签名包"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: 安装依赖
        env:
          # runner 内存/磁盘紧张，把 gradle daemon 堆调小，
          # 避免下载 lint jar 时把磁盘吃光（No space left on device）
          ORG_GRADLE_JVMARGS: -Xmx2G -XX:MaxMetaspaceSize=1G
        run: flutter pub get

      - name: 给 flutter_live2d 打本地补丁
        # 上游 1.0.2 有两个 bug：CubismFramework 在无 GL context 线程初始化、
        # shader 文件没打进 APK，导致「加载成功但画面空白」。补丁脚本幂等。
        run: dart run tool/patch_live2d_plugin.dart


      - name: 校验标签版本与 pubspec 版本一致
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUB_VERSION=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*([^ +]+).*/\1/')
          echo "标签版本: $TAG_VERSION   pubspec 版本: $PUB_VERSION"
          if [ "$TAG_VERSION" != "$PUB_VERSION" ]; then
            echo "::error::标签 v$TAG_VERSION 与 pubspec.yaml 版本 $PUB_VERSION 不一致，请先修改 pubspec.yaml 的 version 再打标签"
            exit 1
          fi
          echo "APP_VERSION=$PUB_VERSION" >> "$GITHUB_ENV"

      - name: 构建 Release APK（按 ABI 拆分）
        env:
          ORG_GRADLE_JVMARGS: -Xmx2G -XX:MaxMetaspaceSize=1G
        run: flutter build apk --release --split-per-abi

      - name: 只保留 ARM 架构并重命名
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi=$(echo "$f" | sed -E 's/^app-(.*)-release\.apk$/\1/')
            case "$abi" in
              arm64-v8a|armeabi-v7a) mv "$f" "call-assistant-${APP_VERSION}-${abi}.apk" ;;
              *) rm -f "$f" ;;
            esac
          done
          ls -lh call-assistant-*.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/app/outputs/flutter-apk/call-assistant-*.apk
          # 构建完几分钟内就会被 publish 取走，7 天足够（省 artifact 存储）
          retention-days: 7
          if-no-files-found: error

  # ============================================================
  # 发布 Windows（只有打 v* 标签才跑）
  # ============================================================
  release-windows:
    name: 发布 Windows 版
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 启用符号链接
        # Flutter 给插件建 .plugin_symlinks 时需要符号链接权限；
        # runner 以管理员运行，这里显式打开 git 侧的开关
        run: git config --global core.symlinks true

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true

      - name: 安装 nuget
        # audioplayers_windows / flutter_tts 的 CMake 用 nuget 还原 WIL / CppWinRT。
        #
        # 直接下 exe 并加进 PATH：插件的 CMakeLists 里 `find_program(NUGET nuget)`
        # 命中就不再走 FetchContent（那条路要访问 dist.nuget.org 并做 SHA256 校验，
        # 网络抖动时直接失败）。比 choco install 快得多 —— choco 要 1 分钟左右。
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\nuget"
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/v6.5.0/nuget.exe" `
            -OutFile "$dir\nuget.exe" -UseBasicParsing
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$dir\nuget.exe" help | Select-Object -First 1

      - name: 安装依赖
        run: flutter pub get

      - name: 给 flutter_live2d 打本地补丁
        # 上游 1.0.2 有两个 bug：CubismFramework 在无 GL context 线程初始化、
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUB_VERSION=$(grep -E '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*([^ +]+).*/\1/')
          echo "标签版本: $TAG_VERSION   pubspec 版本: $PUB_VERSION"
          if [ "$TAG_VERSION" != "$PUB_VERSION" ]; then
            echo "::error::标签 v$TAG_VERSION 与 pubspec.yaml 版本 $PUB_VERSION 不一致，请先修改 pubspec.yaml 的 version 再打标签"
            exit 1
          fi
          echo "APP_VERSION=$PUB_VERSION" >> "$GITHUB_ENV"

      - name: 构建 Release Windows 版
        run: flutter build windows --release

      - name: 打包为 zip（解压后一层：call-assistant-windows-x64/）
        # 走 tool/make_windows_release.ps1，和**本地打包完全同一套逻辑**：
        # 先把产物搬进 staging\call-assistant-windows-x64\ 再压缩，保证 zip 内
        # 第一层就是发行目录。之前直接 7z 压缩 Release 目录，会把 exe 和十几个
        # dll 平铺在 zip 根目录（解压后文件散一地）。
        #
        # 脚本内部优先用 7z（资源里模型文件名带中文，Compress-Archive 在
        # 某些环境下会乱码），没有 7z 时退回 Compress-Archive。
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tool/make_windows_release.ps1 -Version "$env:APP_VERSION" -OutDir build
          $out = "build/call-assistant-$env:APP_VERSION-windows-x64.zip"
          if (-not (Test-Path $out)) { throw "打包失败，没找到 $out" }
          Get-Item $out | Select-Object Name, Length

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/call-assistant-*.zip
          retention-days: 7
          if-no-files-found: error

  # ============================================================
  # 汇总发布：等两端都构建完，统一创建 GitHub Release
  # ============================================================
  publish:
    name: 创建 GitHub Release
    needs: [release-android, release-windows]
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: 列出待发布文件
        run: ls -lhR artifacts

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: call-assistant ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
