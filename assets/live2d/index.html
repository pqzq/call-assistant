<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Live2D Avatar</title>
<style>
  /* 触摸穿透：Android 的 WebView 是混合合成的原生控件，会**吃掉所有触摸事件**，
     导致外层 Flutter 的 GestureDetector（拖动数字人）完全收不到手势。
     这里关掉页面自身的指针事件，让触摸穿透回 Flutter。
     （模型交互本来就已经是 autoInteract: false，不受影响） */
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; pointer-events: none; }
  canvas { display: block; }
  #tip {
    position: absolute; left: 6%; right: 6%; top: 50%; transform: translateY(-50%);
    text-align: center; color: #6b7688; font: 12px/1.6 -apple-system, "PingFang SC", sans-serif;
    white-space: pre-wrap; padding: 8px 10px;
    background: rgba(255,255,255,0.86); border-radius: 10px;
  }
</style>
</head>
<body>
<div id="tip">模型加载中…</div>

<script src="pixi.min.js"></script>
<script src="live2dcubismcore.min.js"></script>
<script src="cubism4.min.js"></script>
<script>
  // 暴露给 Flutter 的控制接口
  const avatar = window.avatar = {
    ready: false,
    status: 'init',
    mouth: 0,        // 目标张嘴幅度 0..1
    mouthSmooth: 0,  // 平滑后的实际值
    speaking: false,
    setMouth(v) { avatar.mouth = Math.max(0, Math.min(1, v || 0)); },
    setSpeaking(on) { avatar.speaking = !!on; if (!on) avatar.mouth = 0; },
    reset() { avatar.mouth = 0; avatar.mouthSmooth = 0; avatar.speaking = false; },
    // Flutter 侧滑杆调「模型大小」时实时调用，不需要重新加载页面
    setZoom(v) {
      const z = parseFloat(v);
      if (!isFinite(z)) return;
      fitOverscan = Math.min(1.8, Math.max(0.8, z));
      if (typeof avatar._fit === 'function') avatar._fit();
    },
    // Flutter 侧调「贴边紧凑模式」：模型在页面内缩小并贴到某一角。
    // 不重建 WebView、不 resize —— 平台视图 resize 会重建 surface，很卡。
    setCompact(on, side, cw, ch) {
      avatar.compact = !!on;
      avatar.compactSide = side || 'left';
      avatar.compactW = cw || 0;
      avatar.compactH = ch || 0;
      if (typeof avatar._fit === 'function') avatar._fit();
    },
    // 返回角色**实际渲染边界**的宽高比（宽/高），供 Flutter 把浮动框
    // 调成贴合模型的比例 —— canvas 通常比角色本体大一圈，直接用
    // canvas 尺寸会让两侧空出一大片。
    // 还没加载好时返回空串，Flutter 侧会稍后重试。
    modelAspect() {
      // 注意：这里必须用 avatar._model（boot 里赋的值）。
      // 直接写 model 会 ReferenceError —— 它在 boot 的闭包里，不在这个对象里
      const m = avatar._model;
      if (!m || !m.getLocalBounds) return '';
      try {
        const b = m.getLocalBounds();
        if (!b || !b.width || !b.height) return '';
        // 只保留 4 位小数，避免科学计数法
        return (b.width / b.height).toFixed(4);
      } catch (e) {
        return '';
      }
    },
    // 角色**本体**在 canvas 里的归一化矩形："中心x,中心y,宽,高"
    // （都除以 canvas 尺寸，取值 0~1）
    //
    // 原生后端没有 getLocalBounds() 的等价 API，只能靠 canvas 尺寸适配 ——
    // 而 canvas 四周留白很大，角色会显得小且偏。这个矩形能让原生侧
    // 按**角色本体**（而不是 canvas）对齐，和 WebView 保持一致。
    modelBounds() {
      const m = avatar._model;
      if (!m || !m.getLocalBounds) return '';
      try {
        const b = m.getLocalBounds();
        // ⚠️ getLocalBounds() 返回的是**本地坐标**（不含 scale），
        // 而 m.width / m.height 是**含 scale** 的显示尺寸 ——
        // 两者量纲不一致，直接相除会算出离谱的归一化值
        // （原生侧据此算缩放系数，会把模型缩成一条腿）。
        // 所以要先把显示尺寸除回未缩放的 canvas 尺寸。
        const sx = m.scale ? m.scale.x : 1;
        const sy = m.scale ? m.scale.y : 1;
        const cw = m.width / (sx || 1);
        const ch = m.height / (sy || 1);
        if (!b || !b.width || !b.height || !cw || !ch) return '';
        const cx = (b.x + b.width / 2) / cw;
        const cy = (b.y + b.height / 2) / ch;
        const w = b.width / cw;
        const h = b.height / ch;
        if (!isFinite(cx) || !isFinite(cy) || !isFinite(w) || !isFinite(h)) return '';
        if (w <= 0 || h <= 0 || w > 1.5 || h > 1.5) return '';
        return [cx, cy, w, h].map((v) => v.toFixed(6)).join(',');
      } catch (e) {
        return '';
      }
    }
  };

  const tip = document.getElementById('tip');

  function fail(msg) {
    avatar.status = 'error: ' + msg;
    tip.textContent = '数字人加载失败\n' + msg;
    tip.style.display = 'block';
  }

  function modelUrlFromQuery() {
    const q = new URLSearchParams(location.search).get('model');
    return q || 'hiyori/Hiyori.model3.json';
  }

  // 模型放大系数（用户可在设置里调）。
  // Live2D 的 canvas 四周留白各模型差异很大，固定值总会「有的太小、有的被裁」，
  // 这里允许从 URL 传入覆盖默认值。
  function fitOverscanFromQuery() {
    const raw = parseFloat(new URLSearchParams(location.search).get('zoom') || '');
    // 1.0 = 模型完整显示（默认）；>1 会放大但底部可能被裁
    if (!isFinite(raw) || raw <= 0) return 1.0;
    return Math.min(1.8, Math.max(0.8, raw));
  }

  // 当前放大系数（可被 Flutter 通过 avatar.setZoom 实时修改）
  let fitOverscan = fitOverscanFromQuery();

  try {
    if (!window.PIXI || !PIXI.live2d) throw new Error('PIXI 或 pixi-live2d-display 未加载');

    const app = new PIXI.Application({
      transparent: true,
      antialias: true,
      autoDensity: true,
      resolution: window.devicePixelRatio || 1,
      resizeTo: window
    });
    document.body.appendChild(app.view);

    // 限制到 30fps（PIXI 默认 60）：数字人动作 30fps 够用，
    // CPU / GPU 占用直接减半 —— WebView2 是多进程的，帧率翻倍代价很高。
    // 同时和原生后端（渲染线程 30fps）保持一致。
    app.ticker.maxFPS = 30;

    const url = modelUrlFromQuery();
    avatar.status = 'loading: ' + url;

    // 先检查模型版本：Cubism 3 的 moc3 是 v6，Cubism 4/5 的 moc3 是 v5 及以下，
    // 当前内置的 Cubism 5 Core 只支持到 v5 -> 提前给出明确提示，而不是英文 core 报错
    const checkVersion = async () => {
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const refs = (json && json.FileReferences) || {};
        const moc = refs.Moc;
        if (typeof moc === 'string' && moc) {
          const mocUrl = new URL(moc, new URL(url, location.href)).href;
          const mres = await fetch(mocUrl, { cache: 'no-store' });
          if (mres.ok) {
            const buf = new Uint8Array(await mres.arrayBuffer());
            if (buf.length >= 6) {
              const ver = buf[4] | (buf[5] << 8);
              if (ver > 5) {
                throw new Error(
                  '该模型是 Cubism 3 格式（moc3 v' + ver + '），当前运行时只支持 Cubism 4/5。\n' +
                  '请改用 Hiyori / Haru / Mao / Mark / Natori / Rice / Wanko。'
                );
              }
            }
          }
        }
      } catch (e) {
        if (e && e.message && e.message.indexOf('Cubism 3') >= 0) throw e;
        // 版本检查失败不阻断（可能是跨域等），交给真正的加载流程报错
      }
    };

    checkVersion().then(() => PIXI.live2d.Live2DModel.from(url, { autoInteract: false })).then((model) => {
      app.stage.addChild(model);
      avatar.app = app;   // 便于诊断

      // 注意：必须用 app.screen（逻辑像素），renderer.width/height 是物理像素，
      // 混用会把模型推到视口外（表现为一片空白）
      const fit = () => {
        const w = app.screen.width;
        const h = app.screen.height;
        // model.width/height 会随 scale 变化，必须先复位到 1 再测量原始尺寸，
        // 否则会二次缩放并把模型推到视口外
        model.scale.set(1);
        const baseW = model.width;
        const baseH = model.height;
        if (!baseW || !baseH) return;

        // ---- 贴边紧凑模式 ----
        // 贴边时浮窗只有一条窄边（112px 左右），但**不重建 WebView**、
        // 也不 resize 它（Android 平台视图 resize 会重建 surface，很卡）。
        // 做法：把模型在页面内**缩到窄条尺寸**，再贴到 WebView 的某一角，
        // Flutter 侧用 OverflowBox 把这一角露出来。
        if (avatar.compact) {
          const cw = avatar.compactW || w;
          const ch = avatar.compactH || h;
          // 紧凑模式**不能放大**（否则模型超出窄条被裁）：固定按窄条尺寸完整放入
          const cScale = Math.min(cw / baseW, ch / baseH) * 0.99;
          model.scale.set(cScale);
          const modelW = baseW * cScale;
          const modelH = baseH * cScale;
          // 紧凑模式：模型缩到窄条尺寸并**贴到视图右上角** ——
          // Flutter 侧裁剪露出的正是视图右上角那一块，两者正好对齐。
          model.x = avatar.compactSide === 'right' ? (w - modelW) : 0;
          model.y = 0;
          return;
        }

        // Live2D 的 canvas 通常比角色本体大一圈（四周留白），
        // 纯 Math.min 适配会让角色显得很小、两侧空一大片。
        // 这里允许高度方向多溢出 25%，让角色更饱满。
        // 溢出的部分主要是 canvas 四周的透明留白，不会裁到角色本体。
        const scale = Math.min(w / baseW, (h / baseH) * fitOverscan) * 0.99;
        model.scale.set(scale);
        model.x = (w - baseW * scale) / 2;
        const scaledH = baseH * scale;
        // 放大系数 > 1 时模型会比容器高，此时**顶部对齐**：
        // 多余部分从底部（脚）裁掉，保证脸和上半身始终完整。
        // （之前是贴底对齐，放大后 y<0 会把头裁掉）
        model.y = scaledH > h ? 0 : h - scaledH;
      };
      fit();
      // 兜底：紧凑状态变化时重新排版。
      // Flutter 侧调 setCompact 的时机可能早于 boot 完成（此时 avatar._fit
      // 还没赋值，调用会被静默跳过），所以每帧检查一次状态变化。
      let lastCompact = avatar.compact;
      app.ticker.add(() => {
        if (avatar.compact !== lastCompact) {
          lastCompact = avatar.compact;
          fit();
        }
      });
      // 暴露给 Flutter：滑杆调「模型大小」时直接重排，不用重载页面；
      // _model 给 modelAspect 用（不能直接引用闭包里的 model）
      avatar._fit = fit;
      avatar._model = model;
      window.addEventListener('resize', () => { app.renderer.resize(window.innerWidth, window.innerHeight); fit(); });

      // 嘴型参数名**各模型不同**（hiyori/haru/natori 是 ParamMouthOpenY，
      // mao 是 ParamA、wanko 是 PARAM_MOUTH_OPEN_Y），
      // 所以优先用 model3.json 里 Groups.LipSync 声明的参数。
      const lipSyncIds = (() => {
        try {
          const s = model.internalModel && model.internalModel.settings;
          const groups = (s && s.groups) || [];
          for (const g of groups) {
            const name = g.Name || g.name;
            if (name === 'LipSync') {
              const ids = g.Ids || g.ids || [];
              if (ids.length) return ids;
            }
          }
        } catch (e) { /* 读不到就回退 */ }
        return ['ParamMouthOpenY'];
      })();

      console.log('lipSync ids = ' + JSON.stringify(lipSyncIds));

      // 嘴型：在动作更新之后覆盖，避免被 idle 动作覆盖
      const applyMouth = () => {
        const core = model.internalModel && model.internalModel.coreModel;
        if (!core) return;
        // 平滑逼近目标值，看起来更自然
        avatar.mouthSmooth += (avatar.mouth - avatar.mouthSmooth) * 0.35;
        for (const id of lipSyncIds) {
          try {
            core.setParameterValueById(id, avatar.mouthSmooth);
          } catch (e) { /* 模型没有该参数时忽略 */ }
        }
      };

      avatar._tick = applyMouth;   // 便于诊断手动调用
      try {
        model.internalModel.on('afterMotionUpdate', applyMouth);
      } catch (e) { /* 事件不存在则由 ticker 兜底 */ }
      // 即使没有动作在跑也要驱动嘴型
      app.ticker.add(applyMouth);

      avatar.model = model;
      avatar.ready = true;
      avatar.status = 'ready';
      tip.style.display = 'none';
    }).catch((e) => fail('' + (e && e.message ? e.message : e)));
  } catch (e) {
    fail('' + (e && e.message ? e.message : e));
  }

  // 阻止页面滚动/缩放干扰
  document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
</script>
</body>
</html>
